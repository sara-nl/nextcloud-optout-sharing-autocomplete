# SPDX-FileCopyrightText: 2026 Autocomplete Settings contributors
# SPDX-License-Identifier: AGPL-3.0-or-later
version = 1
SPDX-PackageName = "autocomplete_settings"
SPDX-PackageSupplier = "Autocomplete Settings contributors"
SPDX-PackageDownloadLocation = "https://github.com/sara-nl/nextcloud-optout-sharing-autocomplete"

# Files that cannot carry a comment
[[annotations]]
path = ["composer.json", "composer.lock", "package.json", "package-lock.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Autocomplete Settings contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["screenshots/*.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Autocomplete Settings contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Translations, rewritten by the translation tool. It puts a placeholder copyright line in the template,
# so this information replaces whatever is in the files.
[[annotations]]
path = ["l10n/**.js", "l10n/**.json", "translationfiles/**.po", "translationfiles/**.pot"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Autocomplete Settings contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
